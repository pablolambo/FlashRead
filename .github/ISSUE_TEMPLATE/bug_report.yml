name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and device
      placeholder: e.g. Android 14, Pixel 7
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: e.g. v0.1.0 or 8b6290b
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste error output here. It is formatted as code automatically.
      render: shell
